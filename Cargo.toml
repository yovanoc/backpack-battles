[package]
name = "backpack-battles"
version = "0.1.0"
edition = "2024"

# The CLI/TUI binary needs clap + ratatui; the library (used by the wasm crate)
# does not, so those deps are optional behind the default `cli` feature.
[[bin]]
name = "backpack-battles"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:ratatui"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"], optional = true }
ratatui = { version = "0.30.2", optional = true }


[profile.release]
lto = true
codegen-units = 1

[workspace]
members = ["wasm"]