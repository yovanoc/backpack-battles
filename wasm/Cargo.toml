[package]
name = "backpack-battles-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
backpack-battles = { path = "..", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
tsify = { version = "0.5.6", default-features = false, features = ["js"] }
